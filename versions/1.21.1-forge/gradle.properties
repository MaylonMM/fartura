# Mappings Parchment (nomes legíveis de parâmetros/variáveis)
# Ver versões em https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft e Forge devem ser compatíveis entre si.
# Lista de versões: https://files.minecraftforge.net/net/minecraftforge/forge/
mod_loader=forge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
forge_version=1.21.1-52.1.2
forge_version_range=[52,)
loader_version_range=[52,)
jei_version=19.27.0.336
# Jade e Patchouli para Forge não estão no Maven: coloque os jars em libs/.
jade_version=manual
patchouli_version=manual
