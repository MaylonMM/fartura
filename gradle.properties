# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# Aceita o uso de build scripts Groovy com Stonecutter (sem o aviso a cada sync)
dev.kikugie.stonecutter.hard_mode=true

# ---- Metadados do mod (compartilhados por todas as versões) ----
