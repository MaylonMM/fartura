# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# Parchment mappings (nomes de parâmetros/variáveis legíveis)
# Ver versões em https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# ---- Versão alvo (alterar aqui ao criar nova versão) ----
# Minecraft e NeoForge devem ser compatíveis entre si.
# Lista de versões: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# ---- Metadados do mod ----
mod_id=brasilfoods
mod_name=Brasil Foods
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.brasilfoods
mod_authors=Maylo
mod_description=Adiciona comidas típicas brasileiras ao Minecraft.
